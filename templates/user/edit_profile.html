{% extends 'base.html' %}

{% block title %}
Edit Profile
{% endblock %}

{% block body %}
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 bg-dark min-vh-100">
            <h4 class="text-white text-center mt-3">
                User Panel
            </h4>
            <div class="nav flex-column mt-4">
                <a href="{{ url_for('user_dashboard') }}" class="nav-link text-white">
                    Dashboard
                </a>
                <a href="{{ url_for('browse_treks') }}" class="nav-link text-white">
                    Browse Treks
                </a>
                <a href="{{ url_for('my_bookings') }}" class="nav-link text-white">
                    My Bookings
                </a>
                <a href="{{ url_for('history') }}" class="nav-link text-white">
                    History
                </a>
                <a href="{{ url_for('profile') }}" class="nav-link text-primary">
                    Profile
                </a>
                <a href="{{ url_for('logout') }}" class="nav-link text-danger">
                    Logout
                </a>
            </div>
        </div>
        <div class="col-md-10">
            <div class="container mt-4">
                <div class="card shadow p-4">
                    <h2 class="text-center mb-4"><i class="bi bi-pencil-square"></i> Edit Profile</h2>
                    <form action="{{ url_for('edit_profile') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" name="name" value="{{ user.name }}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" value="{{ user.email }}" class="form-control" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contact</label>
                            <input type="text" name="contact" value="{{ user.contact }}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" value="{{ user.password }}" class="form-control"
                                required>
                        </div>
                        <button class="btn btn-primary" type="submit">
                            <i class="bi bi-check-circle-fill"></i> Save Changes
                        </button>
                        <a href="{{ url_for('profile') }}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
