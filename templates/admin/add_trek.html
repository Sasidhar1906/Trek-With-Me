{% extends 'base.html' %}

{% block title %}
Add Trek
{% endblock %}

{% block body %}
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 bg-dark min-vh-100">
            <h4 class="text-white text-center mt-3">
                Admin Panel
            </h4>
            <div class="nav flex-column mt-4">
                <a href="{{ url_for('admin_dashboard') }}" class="nav-link text-white">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
                <a href="{{ url_for('manage_treks') }}" class="nav-link text-white">
                    <i class="bi bi-map"></i> Manage Treks
                </a>
                <a href="{{ url_for('manage_staff') }}" class="nav-link text-white">
                    <i class="bi bi-people"></i> Staff
                </a>
                <a href="{{ url_for('bookings') }}" class="nav-link text-white">
                    <i class="bi bi-journal-check"></i> Bookings
                </a>
                <a href="{{ url_for('manage_users') }}" class="nav-link text-white">
                    <i class="bi bi-person"></i> Users
                </a>
                <a href="{{ url_for('admin_history') }}" class="nav-link text-white">
                    <i class="bi bi-clock-history"></i> History
                </a>
                <a href="{{ url_for('logout') }}" class="nav-link text-danger">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </a>
            </div>
        </div>
        <div class="col-md-10">
            <div class="container mt-4">
                <div class="card shadow p-4">
                    <h2 class="text-center mb-4"><i class="bi bi-plus-circle"></i> Add New Trek</h2>
                    <form action="{{url_for('add_trek')}}" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Trek Name</label>
                            <input type="text" name="trek_name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Location</label>
                            <input type="text" name="location" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Difficulty</label>
                            <select name="difficulty" class="form-control">
                                <option value="Easy">Easy</option>
                                <option value="Moderate">Moderate</option>
                                <option value="Hard">Hard</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Duration</label>
                            <input type="number" name="duration" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Total Slots</label>
                            <input type="number" name="total_slots" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-person-check-fill"></i> Assign Staff</label>
                            <select name="assigned_staff_id" class="form-control">
                                {% for staff in staff_all %}
                                <option value="{{staff.id}}">
                                    {{staff.name}}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Start Date</label>
                            <input type="date" name="start_date" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">End Date</label>
                            <input type="date" name="end_date" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea name="desc" class="form-control" rows="4">

                            </textarea>
                        </div>
                        <button class="btn btn-primary" type="submit">Add Trek</button>
                        <a href="{{ url_for('manage_treks') }}" class="btn btn-secondary"> Cancel </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
