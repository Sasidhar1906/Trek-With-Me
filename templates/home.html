{% extends 'base.html' %}

{% block title %}
Home
{% endblock %}

{% block style %}
<style>
    .home-box {
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 15px;
        width: 100%;
        max-width: 400px;
    }

    .home-page {
        background: url("{{ url_for('static', filename='images/home_bg.jpg') }}") no-repeat center center;
        background-size: cover;
        width: 100%;
        min-height: 100vh;
    }

    .overlay {
        background: rgba(0, 0, 0, 0.45);
        min-height: 100vh;
    }
</style>
{% endblock %}

{% block body %}
<div class="home-page">
    <div class="overlay">
        <div class="container d-flex justify-content-center align-items-center vh-100">
            <div class="card shadow p-4 home-box">
                <h2 class="text-center mb-3 text-white">TrekWithMe</h2>
                <p class="text-center text-white">Welcome To TrekWithMe App</p>
                <div class="d-grid gap-3 mt-4">
                    <a href="{{url_for('login')}}" class="btn btn-primary"><i class="bi bi-box-arrow-in-right"></i>
                        Login</a>
                    <a href="{{url_for('register')}}" class="btn btn-primary"><i class="bi bi-person-plus-fill"></i>
                        Register</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
